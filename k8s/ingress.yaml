apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudoptix-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudoptix-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudoptix-frontend
                port:
                  number: 80
